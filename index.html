<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060c10" />
    <title>VelocityMAX</title>

    <!-- Security headers (GitHub Pages doesn't support HTTP headers, so meta tags) -->
    <!-- CSP: allow same origin + Google OAuth (accounts.google.com) + Linear/Everhour APIs -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://api.linear.app https://api.everhour.com https://accounts.google.com https://oauth2.googleapis.com;
      img-src 'self' data: https://lh3.googleusercontent.com;
      frame-src https://accounts.google.com;
      base-uri 'self';
      form-action 'self';
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
