name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [ui-redesign-foundations, feature/project-delivery-milestones]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
